[build]
  # The Express server in server/ is only used for self-hosting; Netlify serves the static Vite output.
  command = "npx vite build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: let the client-side router handle unknown paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
